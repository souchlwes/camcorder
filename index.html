<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>camcorder</title>
    
    <link rel="manifest" href="manifest.json">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        body { 
            margin: 0; padding: 0; background-color: #050505; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; /* Fallback */
            height: 100dvh; /* Fix for iOS Safari address bar */
            width: 100vw; overflow: hidden; 
            font-family: 'VT323', monospace; color: #fff; user-select: none; 
            -webkit-user-select: none;
        }

        .hardware-body {
            width: 100%; height: 100%; max-width: 1200px; max-height: 800px;
            background: linear-gradient(180deg, #d4d4d4 0%, #a6a6a6 50%, #757575 100%);
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5); position: relative;
            box-sizing: border-box;
        }

        .left-panel {
            background: linear-gradient(90deg, #555, #888);
            display: flex; justify-content: center; align-items: center;
            box-sizing: border-box; box-shadow: inset -5px 0 10px rgba(0,0,0,0.5); z-index: 10;
        }

        .center-screen-area { display: flex; justify-content: center; align-items: center; margin: 0; }

        .screen-bezel {
            background: #111; padding: 20px; border-radius: 8px; width: 100%;
            box-sizing: border-box;
            box-shadow: inset 0 0 15px #000, 0 5px 15px rgba(0,0,0,0.8);
            position: relative; display: flex; justify-content: center; align-items: center;
        }

        .brand-logo { position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); font-family: 'Arial Black', sans-serif; font-size: 12px; color: #666; letter-spacing: 3px; z-index: 12; }

        .right-grip {
            background: #222;
            background-image: repeating-linear-gradient(45deg, #1a1a1a 0, #1a1a1a 2px, #222 2px, #222 6px);
            display: flex; justify-content: center; align-items: center; 
            box-shadow: inset 10px 0 20px rgba(0,0,0,0.8); z-index: 10;
            box-sizing: border-box;
        }

        .camcorder-container { 
            position: relative; width: 100%; height: 100%; background: #000; 
            overflow: hidden; border-radius: 4px; box-shadow: inset 0 0 10px rgba(0,0,0,1); 
            transform: translateZ(0); /* Forces iOS Safari to actually clip the border-radius */
        }
        
        video { position: absolute; opacity: 0; pointer-events: none; }
        canvas { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
        
        .scanlines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04)); background-size: 100% 4px, 3px 100%; z-index: 2; }
        .vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.6) 100%); z-index: 3; }
        
        .noise-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); opacity: 0.15; mix-blend-mode: overlay; z-index: 4; transition: opacity 0.2s; }
        
        .nightshot-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background-color: rgba(50, 255, 50, 0.1); display: none; z-index: 4; mix-blend-mode: overlay; }
        
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; padding: 15px; box-sizing: border-box; text-shadow: 2px 2px 0px #000; font-size: 22px; letter-spacing: 1px; display: none; z-index: 10; }
        .top-left { position: absolute; top: 15px; left: 15px; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
        .top-right { position: absolute; top: 15px; right: 15px; text-align: right; }
        .bottom-left { position: absolute; bottom: 15px; left: 15px; color: #ffeb3b; }
        .bottom-right { position: absolute; bottom: 15px; right: 15px; color: #ffeb3b; }
        
        .status-row { display: flex; align-items: center; }
        .rec-dot { width: 12px; height: 12px; background-color: #ff0000; border-radius: 50%; margin-right: 8px; display: none; }
        .is-recording .rec-dot { display: block; animation: blink 1s step-end infinite; }
        .is-recording #status-text { color: #ff0000; }
        .battery { animation: batteryFlicker 10s infinite; display: block; margin-bottom: 15px; }

        .zoom-indicator { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; font-size: 18px; }
        .zoom-track { border: 2px solid #fff; position: relative; background: rgba(0,0,0,0.5); }
        .zoom-fill { position: absolute; background: #fff; transition: all 0.1s; }
        .zoom-digital-line { position: absolute; background: red; z-index: 2; }
        
        #osd-warnings { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: red; font-size: 32px; display: none; z-index: 15; text-shadow: 2px 2px #000; animation: blink 1s infinite; cursor: pointer; pointer-events: auto; text-align: center; }
        
        #save-indicator {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            color: #00ff00; font-size: 36px; text-shadow: 3px 3px 0px #000;
            display: none; z-index: 9999; animation: blink 0.5s step-end infinite;
            text-align: center; pointer-events: none;
        }

        #focus-status, #exp-status { font-size: 18px; color: #fff; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes batteryFlicker { 0%, 98%, 100% { opacity: 1; } 99% { opacity: 0.3; } }
        
        .sleek-btn {
            background: linear-gradient(to bottom, #5a5a5a, #333);
            border: 1px solid #111; border-top: 1px solid #777; border-radius: 6px; 
            color: #eee; font-family: Arial, sans-serif; font-weight: bold; font-size: 11px;
            box-shadow: 0 4px 5px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.2);
            cursor: pointer; touch-action: none; text-transform: uppercase; text-align: center;
            transition: all 0.1s;
        }
        .sleek-btn:active, .sleek-btn.active { 
            background: linear-gradient(to bottom, #333, #222); color: #888;
            box-shadow: 0 1px 1px rgba(0,0,0,0.6), inset 0 2px 4px rgba(0,0,0,0.8); 
            transform: translateY(3px); border-top: 1px solid #111;
        }
        .sleek-btn.active-pause { background: linear-gradient(to bottom, #cca300, #997a00); color: #fff; border-top: 1px solid #ffcc00; }

        .control-group { display: flex; flex-direction: column; align-items: center; width: 60%; margin-bottom: 15px; }
        .control-label { font-size: 10px; color: #aaa; font-family: Arial, sans-serif; margin-bottom: 5px; font-weight: bold; letter-spacing: 1px; text-shadow: 1px 1px 0 #000;}
        
        .vertical-rocker { display: flex; flex-direction: column; background: #1a1a1a; padding: 4px; border-radius: 12px; box-shadow: inset 0 2px 5px #000, 0 1px 1px rgba(255,255,255,0.1); border: 1px solid #000; width: 100%; box-sizing: border-box;}
        .vertical-rocker .sleek-btn { border-radius: 8px 8px 2px 2px; margin: 1px 0; padding: 15px 0; width: 100%; font-size: 14px;}
        .vertical-rocker .btn-bottom { border-radius: 2px 2px 8px 8px; }

        .horizontal-rocker { display: flex; flex-direction: row; background: #1a1a1a; padding: 4px; border-radius: 12px; box-shadow: inset 0 2px 5px #000, 0 1px 1px rgba(255,255,255,0.1); border: 1px solid #000; width: 100%; justify-content: center; box-sizing: border-box;}
        .horizontal-rocker .sleek-btn { border-radius: 8px 2px 2px 8px; margin: 0 1px; padding: 10px 0; width: 50%; font-size: 16px; }
        .horizontal-rocker .btn-right { border-radius: 2px 8px 8px 2px; }

        .record-wrapper { 
            background: linear-gradient(135deg, #e6e6e6, #888); border-radius: 50%; 
            box-shadow: inset 0 2px 5px #fff, 0 4px 6px rgba(0,0,0,0.7); border: 1px solid #555;
            display: flex; justify-content: center; align-items: center; margin-top: 10px;
        }
        .phys-record-btn {
            border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ff4d4d, #cc0000); border: 2px solid #600;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), 0 3px 5px rgba(0,0,0,0.5); cursor: pointer; transition: all 0.1s;
        }
        .phys-record-btn:active, .phys-record-btn.active { 
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.8), 0 1px 1px rgba(0,0,0,0.5); 
            transform: translateY(2px); background: radial-gradient(circle at 30% 30%, #cc0000, #800000);
        }

        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; z-index: 20; font-size: 24px; animation: pulse 2s infinite; cursor: pointer; pointer-events: auto; }
        
        @media (orientation: landscape) {
            .hardware-body { flex-direction: row; }
            .left-panel { width: 15%; height: 100%; flex-direction: column; border-right: 4px solid #333; padding: 10px 5px; gap: 10px; }
            .center-screen-area { width: 60%; height: 100%; flex-grow: 1; box-sizing: border-box; }
            .screen-bezel { height: 85vh; aspect-ratio: 4 / 3; }
            .right-grip { width: 20%; height: 100%; flex-direction: column; border-left: 6px solid #111; border-radius: 40px 0 0 40px; gap: 10px; }
            
            .sleek-btn { padding: 10px 5px; width: 90%; }
            .record-wrapper { padding: 6px; }
            .phys-record-btn { width: 42px; height: 42px; }

            .zoom-indicator { flex-direction: column; }
            .zoom-track { width: 8px; height: 100px; margin: 5px 0; }
            .zoom-fill { bottom: 0; left: 0; width: 100%; }
            .zoom-digital-line { bottom: 40%; left: 0; width: 100%; height: 2px; }
        }

        @media (orientation: portrait) {
            .hardware-body { flex-direction: column; justify-content: space-between; }
            .left-panel { width: 100%; flex: 0 0 auto; flex-direction: row; border-bottom: 4px solid #333; padding: 10px 5px; gap: 4px; flex-wrap: wrap; justify-content: center; }
            .center-screen-area { width: 100%; flex: 1 1 auto; padding: 15px; box-sizing: border-box; min-height: 0; }
            .screen-bezel { width: 100%; height: 100%; max-width: 100%; max-height: 100%; aspect-ratio: unset; padding: 12px; }
            .right-grip { width: 100%; flex: 0 0 auto; flex-direction: row; border-top: 6px solid #111; padding: 15px 10px; justify-content: space-around; gap: 0;}
            
            .sleek-btn { padding: 8px 2px; flex: 1 1 20%; margin: 2px; font-size: 10px; } 
            
            .control-group { width: 25%; margin-bottom: 0; margin-right: 2%; }
            .vertical-rocker { flex-direction: row; }
            .vertical-rocker .sleek-btn { border-radius: 8px 2px 2px 8px; margin: 0 1px; padding: 15px 0; }
            .vertical-rocker .btn-bottom { border-radius: 2px 8px 8px 2px; }
            
            .record-wrapper { width: 60px; height: 60px; margin-top: 0; margin-left: 2%; }
            .phys-record-btn { width: 46px; height: 46px; }
            
            .ui-overlay { font-size: 18px; }
            .top-left, .top-right { top: 40px; } 
            .zoom-indicator { flex-direction: row; top: 15px; left: 50%; transform: translateX(-50%); width: 160px; justify-content: center; }
            .zoom-track { width: 100px; height: 8px; margin: 0 10px; }
            .zoom-fill { top: 0; left: 0; height: 100%; }
            .zoom-digital-line { top: 0; left: 60%; width: 2px; height: 100%; }
        }

    </style>
</head>
<body>

    <div class="hardware-body">
        <div class="left-panel">
            <button class="sleek-btn" id="btn-flip">LENS</button>
            <button class="sleek-btn" id="btn-flash">FLASH</button> 
            <button class="sleek-btn" id="btn-nightshot">NIGHT</button>
            <button class="sleek-btn" id="btn-date">DATE</button> 
            <button class="sleek-btn" id="btn-pause">PAUSE</button> 
            <button class="sleek-btn" id="btn-focus">FOCUS</button> 
            <button class="sleek-btn" id="btn-exp">EXP</button> 
        </div>

        <div class="center-screen-area">
            <div class="screen-bezel">
                <div class="camcorder-container" id="container">
                    <div id="start-screen">TAP TO PWR ON</div>
                    <video id="camera-feed" autoplay playsinline muted></video>
                    <canvas id="video-canvas" style="background-color: #000;"></canvas>
                    
                    <div class="scanlines"></div>
                    <div class="vignette"></div>
                    <div class="noise-overlay" id="noise-layer"></div>
                    <div class="nightshot-overlay" id="ns-overlay"></div>
                    
                    <div id="osd-warnings">C:31:22</div>
                    <div id="save-indicator">DATA SAVED</div>

                    <div class="ui-overlay" id="ui">
                        <div class="top-left">
                            <div class="status-row">
                                <div class="rec-dot" id="rec-dot"></div>
                                <span id="status-text">STBY</span>
                            </div>
                            <span id="focus-status">AF</span>
                            <span id="exp-status" style="display:none;">EV 0.0</span>
                        </div>
                        <div class="top-right"><span class="battery">[■■■]</span></div>
                        
                        <div class="zoom-indicator">
                            <span>W</span>
                            <div class="zoom-track">
                                <div class="zoom-digital-line"></div>
                                <div class="zoom-fill" id="zoom-bar"></div>
                            </div>
                            <span id="zoom-t-label">T</span>
                        </div>

                        <div class="bottom-left"><span id="tape-speed">SP</span></div>
                        <div class="bottom-right" id="timestamp"></div>
                    </div>
                </div>
                <div class="brand-logo">DIGITAL HANDYCAM</div>
            </div>
        </div>

        <div class="right-grip">
            <!-- ZOOM CONTROL -->
            <div class="control-group">
                <span class="control-label">ZOOM</span>
                <div class="vertical-rocker">
                    <button class="sleek-btn" id="btn-zoom-in">T</button>
                    <button class="sleek-btn btn-bottom" id="btn-zoom-out">W</button>
                </div>
            </div>
            
            <!-- BUTTON-BASED FOCUS CONTROL -->
            <div class="control-group" id="focus-control-container" style="display:none;">
                <span class="control-label">MANUAL FOCUS</span>
                <div class="horizontal-rocker">
                    <button class="sleek-btn" id="btn-focus-near">-</button>
                    <button class="sleek-btn btn-right" id="btn-focus-far">+</button>
                </div>
            </div>

            <!-- BUTTON-BASED EXPOSURE CONTROL -->
            <div class="control-group" id="exp-control-container" style="display:none;">
                <span class="control-label">EXPOSURE (EV)</span>
                <div class="horizontal-rocker">
                    <button class="sleek-btn" id="btn-exp-down">-</button>
                    <button class="sleek-btn btn-right" id="btn-exp-up">+</button>
                </div>
            </div>

            <div class="record-wrapper">
                <button class="phys-record-btn" id="btn-phys-record"></button>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('container');
        const startScreen = document.getElementById('start-screen');
        const videoElement = document.getElementById('camera-feed');
        
        const canvas = document.getElementById('video-canvas');
        const ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
        const offscreenCanvas = document.createElement('canvas');
        const offCtx = offscreenCanvas.getContext('2d', { alpha: false });
        
        const ui = document.getElementById('ui');
        const statusText = document.getElementById('status-text');
        const recDot = document.getElementById('rec-dot');
        const tapeSpeed = document.getElementById('tape-speed');
        const nsOverlay = document.getElementById('ns-overlay');
        const noiseLayer = document.getElementById('noise-layer');
        const timestampDiv = document.getElementById('timestamp'); 
        const osdWarnings = document.getElementById('osd-warnings');
        const saveIndicator = document.getElementById('save-indicator');
        const zoomBar = document.getElementById('zoom-bar');
        const zoomTLabel = document.getElementById('zoom-t-label');
        
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        const btnFlip = document.getElementById('btn-flip');
        const btnFlash = document.getElementById('btn-flash'); 
        const btnNightshot = document.getElementById('btn-nightshot');
        const btnDate = document.getElementById('btn-date'); 
        const btnPause = document.getElementById('btn-pause');
        const btnRecord = document.getElementById('btn-phys-record');

        // Focus & Exposure Elements
        const btnFocus = document.getElementById('btn-focus');
        const focusStatus = document.getElementById('focus-status');
        const focusControlContainer = document.getElementById('focus-control-container');
        const btnFocusNear = document.getElementById('btn-focus-near');
        const btnFocusFar = document.getElementById('btn-focus-far');

        const btnExp = document.getElementById('btn-exp');
        const expStatus = document.getElementById('exp-status');
        const expControlContainer = document.getElementById('exp-control-container');
        const btnExpDown = document.getElementById('btn-exp-down');
        const btnExpUp = document.getElementById('btn-exp-up');

        let rawStream;
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let isPaused = false;
        let stoppingFlag = false; 
        
        let audioCtx;
        let micSource;
        let highpass;
        let processedAudioDestination;
        let hissNode;
        let zoomMotorOsc;

        let currentZoom = 1.0;
        const maxZoom = 3.5;
        const digitalZoomThreshold = 2.0; 
        let zoomInterval;
        
        let focusBlurAmount = 0;
        let isManualFocus = false; 
        let focusInterval;
        
        let exposureValue = 1.0;
        let isManualExp = false;
        let expInterval;

        let isFlashOn = false; 

        let isGlitching = false;
        let isBlueScreen = false;
        
        let facingMode = "environment"; 
        let isNightShot = false;
        let showDate = true; 

        startScreen.addEventListener('click', async () => { 
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            await startCamera(); 
        });
        
        btnRecord.addEventListener('click', () => { if(rawStream) toggleRecording(); });
        
        btnFlip.addEventListener('click', async () => { 
            if(rawStream) {
                isFlashOn = false;
                btnFlash.classList.remove('active');
                btnFlash.style.color = '#eee';

                rawStream.getTracks().forEach(track => track.stop());
                facingMode = facingMode === "environment" ? "user" : "environment";
                await startCamera();
            }
        });

        osdWarnings.addEventListener('click', () => { osdWarnings.style.display = 'none'; });

        btnFlash.addEventListener('click', async () => {
            if(!rawStream) return;
            const track = rawStream.getVideoTracks()[0];
            
            try {
                isFlashOn = !isFlashOn;
                await track.applyConstraints({
                    advanced: [{ torch: isFlashOn }]
                });
                
                if (isFlashOn) {
                    btnFlash.classList.add('active');
                    btnFlash.style.color = '#ffeb3b';
                } else {
                    btnFlash.classList.remove('active');
                    btnFlash.style.color = '#eee';
                }
            } catch (err) {
                isFlashOn = false;
                btnFlash.classList.remove('active');
                btnFlash.style.color = '#eee';
                
                osdWarnings.innerText = 'NO FLASH';
                osdWarnings.style.display = 'block';
                setTimeout(() => { osdWarnings.style.display = 'none'; }, 2000);
            }
            playTapeMechanicalSound('click');
        });

        btnPause.addEventListener('click', () => {
            if (!isRecording || !mediaRecorder) return;
            if (mediaRecorder.state === 'recording') {
                mediaRecorder.pause();
                isPaused = true;
                statusText.innerText = 'PAUSE';
                statusText.style.color = '#ffeb3b';
                recDot.style.animation = 'none';
                recDot.style.opacity = '0.5';
                btnPause.classList.add('active-pause');
                btnPause.innerText = 'RESUME';
                playTapeMechanicalSound('click');
            } else if (mediaRecorder.state === 'paused') {
                mediaRecorder.resume();
                isPaused = false;
                statusText.innerText = 'REC';
                statusText.style.color = '#ff0000';
                recDot.style.animation = 'blink 1s step-end infinite';
                recDot.style.opacity = '1';
                btnPause.classList.remove('active-pause');
                btnPause.innerText = 'PAUSE';
                playTapeMechanicalSound('click');
            }
        });

        btnNightshot.addEventListener('click', () => {
            if(!rawStream) return;
            isNightShot = !isNightShot;
            if (isNightShot) {
                btnNightshot.style.color = '#00ff00';
                btnNightshot.classList.add('active');
            } else {
                btnNightshot.style.color = '#eee';
                btnNightshot.classList.remove('active');
            }
            nsOverlay.style.display = isNightShot ? 'block' : 'none';
            playTapeMechanicalSound('click'); 
        });

        btnDate.addEventListener('click', () => {
            if(!rawStream) return;
            showDate = !showDate;
            timestampDiv.style.display = showDate ? 'block' : 'none';
            btnDate.classList.toggle('active');
            playTapeMechanicalSound('click');
        });

        // ----------------------------------------------------
        // Focus & Exposure Display Logic
        // ----------------------------------------------------
        btnFocus.addEventListener('click', () => {
            if(!rawStream) return;
            isManualFocus = !isManualFocus;
            if (isManualFocus) {
                isManualExp = false; btnExp.classList.remove('active');
                expControlContainer.style.display = 'none'; expStatus.style.display = 'none';
                
                btnFocus.classList.add('active');
                focusStatus.innerText = 'MF'; focusStatus.style.color = '#ffeb3b';
                focusControlContainer.style.display = 'flex';
                focusBlurAmount = 0; // Reset safe start
            } else {
                btnFocus.classList.remove('active');
                focusStatus.innerText = 'AF'; focusStatus.style.color = '#fff';
                focusControlContainer.style.display = 'none';
                focusBlurAmount = 0;
            }
            playTapeMechanicalSound('click');
        });

        btnExp.addEventListener('click', () => {
            if(!rawStream) return;
            isManualExp = !isManualExp;
            if (isManualExp) {
                isManualFocus = false; btnFocus.classList.remove('active');
                focusControlContainer.style.display = 'none'; focusStatus.innerText = 'AF'; focusStatus.style.color = '#fff';
                focusBlurAmount = 0;

                btnExp.classList.add('active');
                expStatus.style.display = 'block';
                expControlContainer.style.display = 'flex';
                updateExposureOSD();
            } else {
                btnExp.classList.remove('active');
                expStatus.style.display = 'none';
                expControlContainer.style.display = 'none';
                exposureValue = 1.0; 
                noiseLayer.style.opacity = '0.15';
            }
            playTapeMechanicalSound('click');
        });

        function updateExposureOSD() {
            let evNum = (exposureValue - 1.0) * 2;
            let evString = evNum > 0 ? `+${evNum.toFixed(1)}` : evNum.toFixed(1);
            if (evNum === 0) evString = "0.0";
            expStatus.innerText = `EV ${evString}`;
            expStatus.style.color = '#ffeb3b';
            
            let baseNoise = 0.15;
            let addedNoise = exposureValue > 1.0 ? (exposureValue - 1.0) * 0.35 : 0;
            noiseLayer.style.opacity = (baseNoise + addedNoise).toString();
        }

        // ----------------------------------------------------
        // Audio function for buttons
        // ----------------------------------------------------
        function toggleZoomMotor(isActivating) {
            if (!audioCtx) return;
            
            if (isActivating) {
                if (zoomMotorOsc) return; 
                zoomMotorOsc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                zoomMotorOsc.type = 'sawtooth';
                zoomMotorOsc.frequency.setValueAtTime(150, audioCtx.currentTime); // Low mechanical hum
                
                gainNode.gain.setValueAtTime(0.02, audioCtx.currentTime);
                
                zoomMotorOsc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                zoomMotorOsc.start();
            } else {
                if (zoomMotorOsc) {
                    zoomMotorOsc.stop();
                    zoomMotorOsc.disconnect();
                    zoomMotorOsc = null;
                }
            }
        }

        // ----------------------------------------------------
        // Instant Step + Hold Math
        // ----------------------------------------------------
        function stepValue(type, direction) {
            if (type === 'zoom') {
                const step = 0.04; // Smoother zoom speed
                if (direction === 'in') currentZoom = Math.min(currentZoom + step, maxZoom);
                else currentZoom = Math.max(currentZoom - step, 1.0);
                
                const percent = ((currentZoom - 1.0) / (maxZoom - 1.0)) * 100;
                if (window.innerHeight > window.innerWidth) {
                    zoomBar.style.width = `${percent}%`; zoomBar.style.height = '100%';
                } else {
                    zoomBar.style.height = `${percent}%`; zoomBar.style.width = '100%';
                }
                zoomTLabel.style.color = currentZoom > digitalZoomThreshold ? 'red' : '#fff';
                zoomBar.style.background = currentZoom > digitalZoomThreshold ? 'red' : '#fff';
            }
            else if (type === 'focus' && isManualFocus) {
                const step = 0.3; // Much larger step so blur changes noticeably per tap
                if (direction === 'far') focusBlurAmount = Math.min(focusBlurAmount + step, 8.0);
                else focusBlurAmount = Math.max(focusBlurAmount - step, 0);
            }
            else if (type === 'exp' && isManualExp) {
                const step = 0.02; // Slower exposure change for precise control
                if (direction === 'up') exposureValue = Math.min(exposureValue + step, 2.0);
                else exposureValue = Math.max(exposureValue - step, 0.5);
                updateExposureOSD();
            }
        }

        function startButtonHold(type, direction) {
            if (!rawStream) return;
            toggleZoomMotor(true); 
            
            // Instantly execute one step so quick taps feel responsive
            stepValue(type, direction);
            
            stopButtonHold(type); // clear existing intervals
            
            // Increased interval from 30ms to 50ms so it doesn't fly out of control
            if (type === 'zoom') zoomInterval = setInterval(() => stepValue(type, direction), 50);
            else if (type === 'focus') focusInterval = setInterval(() => stepValue(type, direction), 50);
            else if (type === 'exp') expInterval = setInterval(() => stepValue(type, direction), 50);
        }

        function stopButtonHold(type) { 
            toggleZoomMotor(false);
            if (type === 'zoom' && zoomInterval) clearInterval(zoomInterval);
            if (type === 'focus' && focusInterval) clearInterval(focusInterval);
            if (type === 'exp' && expInterval) clearInterval(expInterval);
        }

        // Attach listeners with touchcancel added for iOS safety
        ['mousedown', 'touchstart'].forEach(evt => {
            btnZoomIn.addEventListener(evt, (e) => { e.preventDefault(); startButtonHold('zoom', 'in'); });
            btnZoomOut.addEventListener(evt, (e) => { e.preventDefault(); startButtonHold('zoom', 'out'); });
            btnFocusNear.addEventListener(evt, (e) => { e.preventDefault(); startButtonHold('focus', 'near'); });
            btnFocusFar.addEventListener(evt, (e) => { e.preventDefault(); startButtonHold('focus', 'far'); });
            btnExpDown.addEventListener(evt, (e) => { e.preventDefault(); startButtonHold('exp', 'down'); });
            btnExpUp.addEventListener(evt, (e) => { e.preventDefault(); startButtonHold('exp', 'up'); });
        });

        ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(evt => {
            btnZoomIn.addEventListener(evt, () => stopButtonHold('zoom'));
            btnZoomOut.addEventListener(evt, () => stopButtonHold('zoom'));
            btnFocusNear.addEventListener(evt, () => stopButtonHold('focus'));
            btnFocusFar.addEventListener(evt, () => stopButtonHold('focus'));
            btnExpDown.addEventListener(evt, () => stopButtonHold('exp'));
            btnExpUp.addEventListener(evt, () => stopButtonHold('exp'));
        });

        setInterval(() => {
            const chance = Math.random();
            if (chance > 0.85) { 
                isGlitching = true;
                setTimeout(() => { isGlitching = false; }, Math.random() * 600 + 100); 
            } else if (chance < 0.08) { 
                isBlueScreen = true;
                setTimeout(() => { isBlueScreen = false; }, Math.random() * 400 + 150);
            }
            if (Math.random() > 0.96 && osdWarnings.style.display === 'none') {
                osdWarnings.innerText = Math.random() > 0.5 ? 'TAPE END' : 'C:31:22';
                osdWarnings.style.display = 'block';
            }
        }, 4000);

        async function startCamera() {
            try {
                rawStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } }, 
                    audio: true 
                });
                
                videoElement.srcObject = rawStream;
                videoElement.load();
                try { await videoElement.play(); } catch (playErr) {}

                startScreen.style.display = 'none';
                ui.style.display = 'block';
                
                if (!audioCtx) {
                    setupRetroAudio(); 
                    startAutofocusHunting(); 
                    requestAnimationFrame(processFrame);
                } else {
                    if (micSource) { try { micSource.disconnect(); } catch(e){} }
                    micSource = audioCtx.createMediaStreamSource(rawStream);
                    micSource.connect(highpass);
                }
            } catch (err) { alert("Camera/Mic access denied or unavailable."); }
        }

        function startAutofocusHunting() {
            setInterval(() => {
                if (!isManualFocus && Math.random() > 0.75) { 
                    focusBlurAmount = Math.random() * 2 + 1; 
                    playTapeMechanicalSound('focus'); 
                    setTimeout(() => { if (!isManualFocus) focusBlurAmount = 0; }, 600 + Math.random() * 800);
                }
            }, 3000);
        }

        function playTapeMechanicalSound(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination); 
            
            if (type === 'start') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'stop') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'click') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(3000, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'focus') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.01, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'beep') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2500, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            }
        }

        function setupRetroAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            micSource = audioCtx.createMediaStreamSource(rawStream);
            processedAudioDestination = audioCtx.createMediaStreamDestination();
            
            highpass = audioCtx.createBiquadFilter();
            highpass.type = 'highpass'; highpass.frequency.value = 300; 
            
            const lowpass = audioCtx.createBiquadFilter();
            lowpass.type = 'lowpass'; lowpass.frequency.value = 4500; 
            
            const distortion = audioCtx.createWaveShaper();
            distortion.curve = makeDistortionCurve(3); 
            distortion.oversample = '4x';
            
            hissNode = createWhiteNoise(audioCtx);
            const hissGain = audioCtx.createGain();
            hissGain.gain.value = 0.015; 
            
            hissNode.connect(hissGain);
            hissGain.connect(processedAudioDestination);
            hissNode.start(); 
            
            micSource.connect(highpass); highpass.connect(lowpass); lowpass.connect(distortion); distortion.connect(processedAudioDestination);
        }

        function makeDistortionCurve(amount) {
            const n_samples = 44100;
            const curve = new Float32Array(n_samples);
            for (let i = 0; i < n_samples; ++i) {
                let x = i * 2 / n_samples - 1;
                curve[i] = Math.tanh(x * amount) / Math.tanh(amount);
            }
            return curve;
        }

        function createWhiteNoise(context) {
            const bufferSize = context.sampleRate * 2; 
            const buffer = context.createBuffer(1, bufferSize, context.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1; 
            const whiteNoise = context.createBufferSource();
            whiteNoise.buffer = buffer; whiteNoise.loop = true; 
            return whiteNoise;
        }

        let lastFrameTime = 0;

        function processFrame(timestamp) {
            requestAnimationFrame(processFrame);

            const targetFPS = isNightShot ? 8 : 14; 
            const frameInterval = 1000 / targetFPS;

            if (!lastFrameTime) lastFrameTime = timestamp;
            const elapsed = timestamp - lastFrameTime;

            if (elapsed < frameInterval) return;
            if (!stoppingFlag && isGlitching && Math.random() > 0.6) return;

            lastFrameTime = timestamp - (elapsed % frameInterval);

            if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA || stoppingFlag) {
                
                let isPortrait = window.innerHeight > window.innerWidth;
                if (isRecording || stoppingFlag) isPortrait = canvas.height > canvas.width; 

                const baseW = isPortrait ? 180 : 240;
                const baseH = isPortrait ? 240 : 180;

                if (canvas.width !== baseW) { 
                    canvas.width = baseW; 
                    canvas.height = baseH; 
                    ctx.imageSmoothingEnabled = false; 
                    ctx.webkitImageSmoothingEnabled = false;
                }
                
                const canvasAspect = canvas.width / canvas.height;
                const videoAspect = videoElement.videoWidth / videoElement.videoHeight;
                
                let sourceW = videoElement.videoWidth;
                let sourceH = videoElement.videoHeight;
                let sourceX = 0;
                let sourceY = 0;

                if (videoAspect > canvasAspect) {
                    sourceW = videoElement.videoHeight * canvasAspect;
                    sourceX = (videoElement.videoWidth - sourceW) / 2;
                } else {
                    sourceH = videoElement.videoWidth / canvasAspect;
                    sourceY = (videoElement.videoHeight - sourceH) / 2;
                }

                // Integer math fix for Safari hardware acceleration
                const sWidth = Math.max(1, Math.floor(sourceW / currentZoom));
                const sHeight = Math.max(1, Math.floor(sourceH / currentZoom));
                const sx = Math.max(0, Math.floor(sourceX + (sourceW - sWidth) / 2));
                const sy = Math.max(0, Math.floor(sourceY + (sourceH - sHeight) / 2));

                if (facingMode === 'user') {
                    ctx.save(); ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
                }

                if (!stoppingFlag && isGlitching && Math.random() > 0.5) {
                    ctx.globalCompositeOperation = 'difference';
                    ctx.drawImage(canvas, (Math.random() - 0.5) * 20, 0);
                }

                let filterString = '';
                if (focusBlurAmount > 0) filterString += `blur(${focusBlurAmount}px) `;
                if (isManualExp) filterString += `brightness(${exposureValue}) `;
                ctx.filter = filterString.trim() || 'none';

                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = isNightShot ? 0.3 : 0.90; 

                if (currentZoom > digitalZoomThreshold) {
                    offscreenCanvas.width = isPortrait ? 90 : 120;
                    offscreenCanvas.height = isPortrait ? 120 : 90;
                    offCtx.imageSmoothingEnabled = false;
                    offCtx.drawImage(videoElement, sx, sy, sWidth, sHeight, 0, 0, offscreenCanvas.width, offscreenCanvas.height);
                    ctx.drawImage(offscreenCanvas, 0, 0, offscreenCanvas.width, offscreenCanvas.height, 0, 0, canvas.width, canvas.height);
                } else {
                    ctx.drawImage(videoElement, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);
                }
                

                offscreenCanvas.width = isPortrait ? 30 : 40;
                offscreenCanvas.height = isPortrait ? 40 : 30;
                offCtx.drawImage(videoElement, sx, sy, sWidth, sHeight, 0, 0, offscreenCanvas.width, offscreenCanvas.height);
                
                ctx.globalCompositeOperation = 'screen';
                ctx.globalAlpha = 0.20; 
                ctx.imageSmoothingEnabled = true; 
                ctx.webkitImageSmoothingEnabled = true;
                ctx.drawImage(offscreenCanvas, 0, 0, offscreenCanvas.width, offscreenCanvas.height, 0, -5, canvas.width, canvas.height + 10);
                ctx.imageSmoothingEnabled = false; 
                ctx.webkitImageSmoothingEnabled = false;

                // Fixed filter reset location
                ctx.filter = 'none';

                if (facingMode === 'user') {
                    ctx.restore();
                }

                if (isNightShot) {
                    ctx.globalCompositeOperation = 'multiply';
                    ctx.fillStyle = 'rgba(80, 255, 80, 0.4)';
                    ctx.globalAlpha = 1.0;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                } else {
                    ctx.globalCompositeOperation = 'screen';
                    ctx.fillStyle = 'rgba(35, 25, 30, 0.3)';
                    ctx.globalAlpha = 1.0;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    ctx.globalCompositeOperation = 'multiply';
                    ctx.fillStyle = 'rgba(255, 240, 225, 0.8)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                if (!stoppingFlag && isBlueScreen) {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.fillStyle = '#0000AA';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                    for (let i = 0; i < 8; i++) {
                        ctx.fillRect(0, Math.random() * canvas.height, canvas.width, Math.random() * 4);
                    }
                }

                ctx.globalAlpha = 1.0;
                ctx.globalCompositeOperation = 'source-over';
            }
        }

        function triggerSaveSuccess() {
            saveIndicator.style.display = 'block';
            playTapeMechanicalSound('beep');
            setTimeout(() => { saveIndicator.style.display = 'none'; }, 3000);
        }

        function toggleRecording() {
            if (!isRecording) {
                if(audioCtx.state === 'suspended') audioCtx.resume(); 
                playTapeMechanicalSound('start');

                recordedChunks = [];
                const canvasStream = canvas.captureStream(15);
                
                const audioTracks = processedAudioDestination.stream.getAudioTracks();
                if (audioTracks.length > 0) canvasStream.addTrack(audioTracks[0]);

                mediaRecorder = new MediaRecorder(canvasStream);
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = exportVideo;
                
                mediaRecorder.start(250);

                isRecording = true;
                isPaused = false;
                stoppingFlag = false;
                container.classList.add('is-recording');
                statusText.innerText = 'REC'; statusText.style.color = '#ff0000';
                tapeSpeed.innerText = 'REC'; 
                recDot.style.animation = 'blink 1s step-end infinite'; recDot.style.opacity = '1';
                btnRecord.classList.add('active'); 
                
                btnPause.classList.remove('active-pause');
                btnPause.innerText = 'PAUSE';

            } else {
                playTapeMechanicalSound('stop');
                
                stoppingFlag = true;
                
                setTimeout(() => {
                    mediaRecorder.stop();
                    isRecording = false;
                    isPaused = false;
                    stoppingFlag = false;
                    container.classList.remove('is-recording');
                    statusText.innerText = 'STBY'; statusText.style.color = '#eee';
                    tapeSpeed.innerText = 'SP';
                    recDot.style.animation = 'none'; recDot.style.opacity = '1';
                    btnRecord.classList.remove('active'); 
                    
                    btnPause.classList.remove('active-pause');
                    btnPause.innerText = 'PAUSE';
                }, 500); 
            }
        }

        async function exportVideo() {
            const mimeType = mediaRecorder.mimeType || 'video/webm';
            const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
            
            const blob = new Blob(recordedChunks, { type: mimeType });
            const file = new File([blob], `Y2K_CAM_${Date.now()}.${ext}`, { type: mimeType });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: 'Y2K Camcorder Footage'
                    });
                    console.log('Video saved to device.');
                    triggerSaveSuccess();
                } catch (error) {
                    console.log('User canceled save or sharing failed.', error);
                }
            } else {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none'; a.href = url; a.download = file.name;
                document.body.appendChild(a); a.click();
                setTimeout(() => { 
                    document.body.removeChild(a); 
                    window.URL.revokeObjectURL(url); 
                    triggerSaveSuccess();
                }, 100);
            }
        }

        function updateTimestamp() {
            const now = new Date();
            const pad = (num) => String(num).padStart(2, '0');
            timestampDiv.innerText = `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        }

        setInterval(updateTimestamp, 1000); updateTimestamp();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Offline Mode Active'))
                    .catch(err => console.error('Offline Mode Failed', err));
            });
        }
    </script>
</body>
